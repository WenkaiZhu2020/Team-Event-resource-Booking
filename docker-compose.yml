services:
  postgres:
    image: postgres:16
    container_name: trms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-team_resource_mgmt}
      POSTGRES_USER: ${POSTGRES_USER:-team_resource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
    ports:
      - "5432:5432"
    volumes:
      - trms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-team_resource} -d ${POSTGRES_DB:-team_resource_mgmt}"]
      interval: 10s
      timeout: 5s
      retries: 8

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: trms-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: trms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    container_name: trms-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-team_resource_mgmt}
      AUTH_DB_USERNAME: ${POSTGRES_USER:-team_resource}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
      JWT_ISSUER: ${JWT_ISSUER:-team-resource-auth}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-google-client-secret}
      OAUTH2_REDIRECT_BASE_URL: ${OAUTH2_REDIRECT_BASE_URL:-http://localhost:8080}
      OAUTH2_SUCCESS_REDIRECT_URL: ${OAUTH2_SUCCESS_REDIRECT_URL:-http://localhost:5173/oauth2/callback}
      OAUTH2_FAILURE_REDIRECT_URL: ${OAUTH2_FAILURE_REDIRECT_URL:-http://localhost:5173/login}
      USER_SERVICE_INTEGRATION_ENABLED: true
      USER_SERVICE_BASE_URL: http://user-service:8082
      USER_SERVICE_API_KEY: ${USER_SERVICE_API_KEY:-change-me}
    ports:
      - "8081:8081"

  user-service:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
    container_name: trms-user
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      USER_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-team_resource_mgmt}
      USER_DB_USERNAME: ${POSTGRES_USER:-team_resource}
      USER_DB_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
      JWT_ISSUER: ${JWT_ISSUER:-team-resource-auth}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      USER_SERVICE_API_KEY: ${USER_SERVICE_API_KEY:-change-me}
    ports:
      - "8082:8082"

  event-service:
    build:
      context: ./backend
      dockerfile: services/event-service/Dockerfile
    container_name: trms-event
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      EVENT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-team_resource_mgmt}
      EVENT_DB_USERNAME: ${POSTGRES_USER:-team_resource}
      EVENT_DB_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
      JWT_ISSUER: ${JWT_ISSUER:-team-resource-auth}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      EVENT_SERVICE_API_KEY: ${EVENT_SERVICE_API_KEY:-change-me}
      WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8087
      WORKFLOW_SERVICE_API_KEY: ${WORKFLOW_SERVICE_API_KEY:-change-me}
      EVENT_ADMIN_APPROVAL_CAPACITY_THRESHOLD: ${EVENT_ADMIN_APPROVAL_CAPACITY_THRESHOLD:-100}
    ports:
      - "8083:8083"

  resource-service:
    build:
      context: ./backend
      dockerfile: services/resource-service/Dockerfile
    container_name: trms-resource
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      RESOURCE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-team_resource_mgmt}
      RESOURCE_DB_USERNAME: ${POSTGRES_USER:-team_resource}
      RESOURCE_DB_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
      JWT_ISSUER: ${JWT_ISSUER:-team-resource-auth}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      RESOURCE_SERVICE_API_KEY: ${RESOURCE_SERVICE_API_KEY:-change-me}
    ports:
      - "8084:8084"

  booking-service:
    build:
      context: ./backend
      dockerfile: services/booking-service/Dockerfile
    container_name: trms-booking
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      resource-service:
        condition: service_started
      event-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      BOOKING_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-team_resource_mgmt}
      BOOKING_DB_USERNAME: ${POSTGRES_USER:-team_resource}
      BOOKING_DB_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
      JWT_ISSUER: ${JWT_ISSUER:-team-resource-auth}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RESOURCE_SERVICE_BASE_URL: http://resource-service:8084
      EVENT_SERVICE_BASE_URL: http://event-service:8083
      WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8087
      BOOKING_SERVICE_API_KEY: ${BOOKING_SERVICE_API_KEY:-change-me}
      WORKFLOW_SERVICE_API_KEY: ${WORKFLOW_SERVICE_API_KEY:-change-me}
      BOOKING_REDIS_ADDRESS: ${BOOKING_REDIS_ADDRESS:-redis://redis:6379}
    ports:
      - "8085:8085"

  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    container_name: trms-notification
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-team_resource_mgmt}
      NOTIFICATION_DB_USERNAME: ${POSTGRES_USER:-team_resource}
      NOTIFICATION_DB_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
      JWT_ISSUER: ${JWT_ISSUER:-team-resource-auth}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EVENT_SERVICE_BASE_URL: http://event-service:8083
      EVENT_SERVICE_API_KEY: ${EVENT_SERVICE_API_KEY:-change-me}
      EVENT_REMINDER_ENABLED: ${EVENT_REMINDER_ENABLED:-true}
      EVENT_REMINDER_FIXED_DELAY_MS: ${EVENT_REMINDER_FIXED_DELAY_MS:-900000}
      EVENT_REMINDER_INITIAL_DELAY_MS: ${EVENT_REMINDER_INITIAL_DELAY_MS:-30000}
      EVENT_REMINDER_LOOKAHEAD_HOURS: ${EVENT_REMINDER_LOOKAHEAD_HOURS:-24}
    ports:
      - "8086:8086"

  workflow-service:
    build:
      context: ./backend
      dockerfile: services/workflow-service/Dockerfile
    container_name: trms-workflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      booking-service:
        condition: service_started
      event-service:
        condition: service_started
      resource-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8087
      WORKFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-team_resource_mgmt}
      WORKFLOW_DB_USERNAME: ${POSTGRES_USER:-team_resource}
      WORKFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
      JWT_ISSUER: ${JWT_ISSUER:-team-resource-auth}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      WORKFLOW_SERVICE_API_KEY: ${WORKFLOW_SERVICE_API_KEY:-change-me}
      BOOKING_SERVICE_BASE_URL: http://booking-service:8085
      BOOKING_SERVICE_API_KEY: ${BOOKING_SERVICE_API_KEY:-change-me}
      EVENT_SERVICE_BASE_URL: http://event-service:8083
      EVENT_SERVICE_API_KEY: ${EVENT_SERVICE_API_KEY:-change-me}
      RESOURCE_SERVICE_BASE_URL: http://resource-service:8084
      RESOURCE_SERVICE_API_KEY: ${RESOURCE_SERVICE_API_KEY:-change-me}
      WORKFLOW_BOOKING_EVENTS_QUEUE: ${WORKFLOW_BOOKING_EVENTS_QUEUE:-workflow.booking.events}
    ports:
      - "8087:8087"

  analytics-service:
    build:
      context: ./backend
      dockerfile: services/analytics-service/Dockerfile
    container_name: trms-analytics
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      booking-service:
        condition: service_started
    environment:
      SERVER_PORT: 8088
      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-team_resource_mgmt}
      ANALYTICS_DB_USERNAME: ${POSTGRES_USER:-team_resource}
      ANALYTICS_DB_PASSWORD: ${POSTGRES_PASSWORD:-team_resource}
      JWT_ISSUER: ${JWT_ISSUER:-team-resource-auth}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ANALYTICS_QUEUE_NAME: ${ANALYTICS_QUEUE_NAME:-analytics.booking.events}
      ANALYTICS_DLQ_NAME: ${ANALYTICS_DLQ_NAME:-analytics.booking.events.dlq}
      ANALYTICS_POPULARITY_REFRESH_MS: ${ANALYTICS_POPULARITY_REFRESH_MS:-300000}
      ANALYTICS_DASHBOARD_THREAD_POOL_SIZE: ${ANALYTICS_DASHBOARD_THREAD_POOL_SIZE:-4}
    ports:
      - "8088:8088"

  api-gateway-service:
    build:
      context: ./backend
      dockerfile: services/api-gateway-service/Dockerfile
    container_name: trms-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      event-service:
        condition: service_started
      resource-service:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service:
        condition: service_started
      workflow-service:
        condition: service_started
      analytics-service:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      EVENT_SERVICE_URL: http://event-service:8083
      RESOURCE_SERVICE_URL: http://resource-service:8084
      BOOKING_SERVICE_URL: http://booking-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      WORKFLOW_SERVICE_URL: http://workflow-service:8087
      ANALYTICS_SERVICE_URL: http://analytics-service:8088
    ports:
      - "8080:8080"

volumes:
  trms_postgres_data:
