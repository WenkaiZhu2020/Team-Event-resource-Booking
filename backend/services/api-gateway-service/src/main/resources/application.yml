server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
      default-filters:
        - RemoveRequestHeader=Cookie

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
  gateway:
    services:
      auth: ${AUTH_SERVICE_URL:http://localhost:8081}
      user: ${USER_SERVICE_URL:http://localhost:8082}
      event: ${EVENT_SERVICE_URL:http://localhost:8083}
      resource: ${RESOURCE_SERVICE_URL:http://localhost:8084}
      booking: ${BOOKING_SERVICE_URL:http://localhost:8085}
      notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
      workflow: ${WORKFLOW_SERVICE_URL:http://localhost:8087}
      analytics: ${ANALYTICS_SERVICE_URL:http://localhost:8088}
    public-paths:
      - /api/v1/auth/**
      - /oauth2/**
      - /login/oauth2/**
      - /actuator/health
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
