server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/team_resource_mgmt}
    username: ${NOTIFICATION_DB_USERNAME:team_resource}
    password: ${NOTIFICATION_DB_PASSWORD:team_resource}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notifications
  flyway:
    enabled: true
    default-schema: notifications
    schemas: notifications
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:team-resource-auth}
      secret-base64: ${JWT_SECRET_BASE64:VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
  clients:
    event-service-base-url: ${EVENT_SERVICE_BASE_URL:http://localhost:8083}
    event-service-api-key: ${EVENT_SERVICE_API_KEY:change-me}
    internal-api-header-name: ${INTERNAL_API_KEY_HEADER:X-Internal-Api-Key}
  reminders:
    enabled: ${EVENT_REMINDER_ENABLED:true}
    fixed-delay-ms: ${EVENT_REMINDER_FIXED_DELAY_MS:900000}
    initial-delay-ms: ${EVENT_REMINDER_INITIAL_DELAY_MS:30000}
    lookahead-hours: ${EVENT_REMINDER_LOOKAHEAD_HOURS:24}

  messaging:
    inbound-exchange: ${NOTIFICATION_INBOUND_EXCHANGE:team-resource.events}
    inbound-routing-key: ${NOTIFICATION_INBOUND_ROUTING_KEY:booking.*}
    consumers:
      booking-events-queue: ${NOTIFICATION_BOOKING_EVENTS_QUEUE:notification.booking.events.v2}
      booking-events-dlq: ${NOTIFICATION_BOOKING_EVENTS_DLQ:notification.booking.events.v2.dlq}
    retry:
      max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
      backoff-seconds: ${NOTIFICATION_RETRY_BACKOFF_SECONDS:60}
    reminder:
      polling-seconds: ${NOTIFICATION_REMINDER_POLLING_SECONDS:60}
  channels:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
      from: ${NOTIFICATION_EMAIL_FROM:no-reply@teamresource.local}
