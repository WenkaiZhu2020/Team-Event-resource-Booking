server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/team_resource_mgmt}
    username: ${AUTH_DB_USERNAME:team_resource}
    password: ${AUTH_DB_PASSWORD:team_resource}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    enabled: true
    default-schema: auth
    schemas: auth
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:team-resource-auth}
      secret-base64: ${JWT_SECRET_BASE64:VEVBTV9SRVNPVVJDRV9NQU5BR0VNRU5UX0RFVl9TRUNSRVRfSFM1Nl8zMl9CWVRFUw==}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  integrations:
    user-service:
      enabled: ${USER_SERVICE_INTEGRATION_ENABLED:false}
      base-url: ${USER_SERVICE_BASE_URL:http://localhost:8082}
      api-key: ${USER_SERVICE_API_KEY:change-me}
  oauth2:
    google-enabled: ${GOOGLE_OAUTH_ENABLED:false}
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth2/callback}
    failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:5173/login}
