name: release-package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: mvn -f backend/pom.xml test -DskipITs

      - name: Package backend services
        run: mvn -f backend/pom.xml -DskipTests package

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_GOOGLE_OAUTH_ENABLED: false
        run: npm run build

      - name: Upload backend jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars-${{ github.sha }}
          path: backend/services/*/target/*.jar
          if-no-files-found: error

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error

  docker-build-check:
    needs: verify-and-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_OAUTH_ENABLED=false

      - name: Build backend images
        shell: bash
        run: |
          set -euo pipefail
          services=(
            api-gateway-service
            auth-service
            user-service
            event-service
            resource-service
            booking-service
            notification-service
            workflow-service
            analytics-service
          )
          for service in "${services[@]}"; do
            docker build \
              -f "backend/services/${service}/Dockerfile" \
              -t "trms/${service}:${GITHUB_SHA}" \
              backend
          done
